[build]
  command = "npm run build"
  publish = "dist"

  # Supabase public URL. The browser publishable key is in src/lib/publicSupabaseConfig.js.
  # Netlify environment variable writes are currently restricted (HTTP 403).
  [build.environment]
    VITE_SUPABASE_URL = "https://oaihjgmmoxvunuxtucin.supabase.co"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# HTTPS browser security policies for the public React PWA. Browser-side code is
# visible to visitors by design; server-side auth, RLS and API checks protect data.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://oaihjgmmoxvunuxtucin.supabase.co; font-src 'self' data:; media-src 'self' data: blob: https://oaihjgmmoxvunuxtucin.supabase.co; connect-src 'self' https://oaihjgmmoxvunuxtucin.supabase.co wss://oaihjgmmoxvunuxtucin.supabase.co https://kaada-study-ai.kaada-p.workers.dev; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

# Update the app shell and service worker promptly; hashed JS/CSS stay immutable.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
