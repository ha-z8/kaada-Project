name: Verify app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify live Supabase account function CORS
        if: github.ref == 'refs/heads/main'
        run: node scripts/account-edge-smoke.mjs
      - name: Check managed AI backend health and authentication
        if: github.ref == 'refs/heads/main'
        run: node scripts/cloudflare-ai-smoke.mjs
      - name: Check current production AI readiness
        if: github.ref == 'refs/heads/main'
        run: node scripts/check-ai-status.mjs
